<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel — Julia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --roxo-profundo: #6B4E8E;
    --roxo-medio: #8F6BAE;
    --roxo-violeta: #A76BC0;
    --lilas-claro: #F3EAF8;
    --quase-branco: #FBF7FD;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--quase-branco);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    color: var(--roxo-profundo);
    min-height: 100vh;
  }
  header { padding: 48px 24px 24px; text-align: center; }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 2.2rem;
    margin: 0 0 6px;
    color: var(--roxo-profundo);
  }
  header p { margin: 0; font-weight: 300; color: var(--roxo-medio); letter-spacing: 0.03em; }

  nav { display: flex; justify-content: center; gap: 10px; padding: 0 24px 24px; flex-wrap: wrap; }
  nav button {
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    font-size: 0.9rem;
    border: 1px solid var(--roxo-violeta);
    background: transparent;
    color: var(--roxo-profundo);
    padding: 9px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  nav button.ativo { background: var(--roxo-profundo); color: var(--quase-branco); border-color: var(--roxo-profundo); }

  .tela { display: none; }
  .tela.ativa { display: block; }

  .filtros { display: flex; justify-content: center; gap: 8px; padding: 0 24px 28px; flex-wrap: wrap; }
  .filtros button {
    font-family: 'Jost', sans-serif;
    font-size: 0.82rem;
    border: 1px solid var(--lilas-claro);
    background: #fff;
    color: var(--roxo-medio);
    padding: 6px 16px;
    border-radius: 999px;
    cursor: pointer;
  }
  .filtros button.ativo { background: var(--lilas-claro); color: var(--roxo-profundo); font-weight: 500; border-color: var(--roxo-violeta); }

  main { max-width: 900px; margin: 0 auto; padding: 0 24px 80px; }

  .caixa-nova-ideia {
    background: #ffffff;
    border: 1px solid var(--lilas-claro);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 28px;
    box-shadow: 0 4px 18px rgba(107, 78, 142, 0.06);
  }
  .caixa-nova-ideia summary {
    cursor: pointer;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.05rem;
    color: var(--roxo-profundo);
    list-style: none;
  }
  .caixa-nova-ideia summary::-webkit-details-marker { display: none; }
  .caixa-nova-ideia summary::before { content: "+ "; }
  .caixa-nova-ideia[open] summary::before { content: "− "; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .form-grid .full { grid-column: 1 / -1; }

  .caixa-nova-ideia label, .caixa-ideia-livre label {
    display: block;
    font-size: 0.78rem;
    color: var(--roxo-medio);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .caixa-nova-ideia input, .caixa-nova-ideia select, .caixa-nova-ideia textarea,
  .caixa-ideia-livre textarea, .caixa-ideia-livre select {
    width: 100%;
    font-family: 'Jost', sans-serif;
    font-size: 0.92rem;
    padding: 9px 12px;
    border: 1px solid var(--lilas-claro);
    border-radius: 10px;
    color: var(--roxo-profundo);
    background: var(--quase-branco);
  }
  .caixa-nova-ideia textarea, .caixa-ideia-livre textarea { resize: vertical; min-height: 60px; }

  .btn-salvar-ideia {
    margin-top: 14px;
    background: var(--roxo-profundo);
    color: var(--quase-branco);
    border: none;
    padding: 10px 22px;
    border-radius: 999px;
    font-family: 'Jost', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn-salvar-ideia:hover { background: var(--roxo-violeta); }

  .feedback-form { font-size: 0.82rem; margin-top: 10px; min-height: 18px; }
  .feedback-form.ok { color: #4a7a52; }
  .feedback-form.erro { color: #a34a4a; }

  #status-msg { text-align: center; color: var(--roxo-medio); font-size: 0.95rem; padding: 40px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  .card {
    background: #ffffff;
    border: 1px solid var(--lilas-claro);
    border-radius: 16px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 4px 18px rgba(107, 78, 142, 0.06);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
    position: relative;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(107, 78, 142, 0.12); }
  .card.minha { border: 1px solid var(--roxo-violeta); }
  .card.feito { opacity: 0.6; }
  .card.saindo { opacity: 0; transform: scale(0.96); }
  .selo-minha {
    position: absolute; top: -9px; right: 16px;
    background: var(--roxo-violeta); color: #fff;
    font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 3px 10px; border-radius: 999px;
  }
  .card-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .badge {
    font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 999px; white-space: nowrap; font-weight: 500; flex-shrink: 0;
  }
  .badge-reel { background: #F3EAF8; color: #6B4E8E; }
  .badge-carrossel { background: #EFE3F5; color: #7A4E9E; }
  .badge-story { background: #E7D6F0; color: #5C3D7D; }
  .card h3 {
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500;
    font-size: 1.1rem; margin: 0; line-height: 1.35; color: var(--roxo-profundo);
  }
  .card .tema { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--roxo-violeta); font-weight: 400; }
  .card p.desc { font-size: 0.92rem; line-height: 1.5; color: #5a4a68; margin: 0; font-weight: 300; }
  .card-rodape {
    margin-top: auto; padding-top: 10px; border-top: 1px solid var(--lilas-claro);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.78rem; color: var(--roxo-medio);
  }
  .card-rodape a { color: var(--roxo-profundo); text-decoration: none; font-weight: 500; }
  .card-rodape a:hover { text-decoration: underline; }

  .linha-acoes { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

  .status-btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--lilas-claro); background: var(--quase-branco);
    padding: 5px 12px; border-radius: 999px; font-size: 0.75rem; cursor: pointer; color: var(--roxo-profundo);
  }
  .status-btn .bolinha { width: 8px; height: 8px; border-radius: 50%; background: #b9a8c9; }
  .status-btn.novo .bolinha { background: #A76BC0; }
  .status-btn.em-producao .bolinha { background: #E0A548; }
  .status-btn.feito .bolinha { background: #4a9a63; }

  .btn-descartar { border: none; background: transparent; color: #b08a8a; font-size: 0.75rem; cursor: pointer; padding: 5px 8px; }
  .btn-descartar:hover { color: #a34a4a; text-decoration: underline; }

  footer { text-align: center; padding: 30px 20px 50px; font-size: 0.75rem; color: var(--roxo-violeta); opacity: 0.7; }

  .sub-nav { display: flex; justify-content: center; gap: 8px; padding: 0 24px 8px; flex-wrap: wrap; }
  .sub-nav button {
    font-family: 'Jost', sans-serif;
    font-size: 0.85rem;
    border: 1px solid var(--lilas-claro);
    background: #fff;
    color: var(--roxo-medio);
    padding: 7px 18px;
    border-radius: 999px;
    cursor: pointer;
  }
  .sub-nav button.ativo { background: var(--lilas-claro); color: var(--roxo-profundo); font-weight: 500; border-color: var(--roxo-violeta); }

  .subarea { display: none; }
  .subarea.ativa { display: block; }

  .barra-progresso-caixa {
    background: #fff;
    border: 1px solid var(--lilas-claro);
    border-radius: 16px;
    padding: 18px 22px;
    margin-bottom: 24px;
    box-shadow: 0 4px 18px rgba(107, 78, 142, 0.05);
  }
  .barra-progresso-topo { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .barra-progresso-topo span:first-child {
    font-family: 'Playfair Display', serif; font-style: italic; font-size: 1rem; color: var(--roxo-profundo);
  }
  .barra-progresso-topo span:last-child { font-size: 0.82rem; color: var(--roxo-medio); }
  .barra-fundo { background: var(--lilas-claro); border-radius: 999px; height: 8px; overflow: hidden; }
  .barra-preenchida { background: var(--roxo-violeta); height: 100%; border-radius: 999px; transition: width 0.4s ease; }

  .checklist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 32px; }
  .item-checklist {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border: 1px solid var(--lilas-claro); border-radius: 12px;
    padding: 12px 16px; cursor: pointer; transition: opacity 0.2s ease, background 0.2s ease;
  }
  .item-checklist:hover { background: var(--lilas-claro); }
  .marcador { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--roxo-violeta); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: #fff; }
  .item-checklist.a_fazer .marcador { background: transparent; }
  .item-checklist.em_andamento .marcador { background: #E0A548; border-color: #E0A548; }
  .item-checklist.em_andamento .marcador::after { content: "…"; }
  .item-checklist.feito .marcador { background: #4a9a63; border-color: #4a9a63; }
  .item-checklist.feito .marcador::after { content: "✓"; }
  .item-checklist.feito .texto-item { text-decoration: line-through; opacity: 0.55; }
  .texto-item { font-size: 0.92rem; color: var(--roxo-profundo); }

  .titulo-secao {
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500;
    font-size: 1.15rem; color: var(--roxo-profundo); margin: 0 0 14px;
  }

  .caixa-ideia-livre {
    background: #ffffff; border: 1px dashed var(--roxo-violeta); border-radius: 16px;
    padding: 18px; margin-bottom: 20px;
  }
  .grid-ideias-livres { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card-ideia-livre {
    background: #fdf9fe; border: 1px solid var(--lilas-claro); border-radius: 14px;
    padding: 16px; font-size: 0.88rem; color: #5a4a68; line-height: 1.5; position: relative;
  }
  .card-ideia-livre .area-tag {
    display: inline-block; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--roxo-violeta); font-weight: 500; margin-bottom: 6px;
  }
  .status-msg-plano { text-align: center; color: var(--roxo-medio); font-size: 0.9rem; padding: 20px 0; }
</style>
</head>
<body>

<header>
  <h1>Painel de conteúdo</h1>
  <p>@juliaalt.psi</p>
</header>

<nav>
  <button class="ativo" data-tela="radar">Radar de Conteúdo</button>
  <button data-tela="plano">Meu Plano</button>
</nav>

<div class="tela ativa" id="tela-radar">

  <div class="filtros" id="filtros">
    <button class="ativo" data-filtro="todos">Todos</button>
    <button data-filtro="reel">Reels</button>
    <button data-filtro="carrossel">Carrossel</button>
    <button data-filtro="story">Story</button>
  </div>

  <main>
    <details class="caixa-nova-ideia">
      <summary>Adicionar minha própria ideia</summary>
      <form id="form-ideia">
        <div class="form-grid">
          <div class="full">
            <label for="f-titulo">Título</label>
            <input id="f-titulo" required maxlength="120" />
          </div>
          <div>
            <label for="f-tema">Tema</label>
            <input id="f-tema" required maxlength="120" />
          </div>
          <div>
            <label for="f-formato">Formato</label>
            <select id="f-formato">
              <option value="reel">Reel</option>
              <option value="carrossel">Carrossel</option>
              <option value="story">Story</option>
            </select>
          </div>
          <div class="full">
            <label for="f-descricao">Descrição</label>
            <textarea id="f-descricao" required maxlength="400"></textarea>
          </div>
          <div class="full">
            <label for="f-link">Link de referência (opcional)</label>
            <input id="f-link" type="url" />
          </div>
        </div>
        <button type="submit" class="btn-salvar-ideia">Salvar ideia</button>
        <div id="feedback-form" class="feedback-form"></div>
      </form>
    </details>

    <div id="status-msg">Carregando pautas...</div>
    <div class="grid" id="grid-pautas"></div>
  </main>

</div>

<div class="tela" id="tela-plano">

  <div class="sub-nav" id="sub-nav-plano">
    <button class="ativo" data-area="instagram">Instagram</button>
    <button data-area="ebook">Ebook</button>
    <button data-area="plataforma">Plataforma</button>
    <button data-area="ideias">Ideias soltas</button>
  </div>

  <main>

    <div class="subarea ativa" data-subarea="instagram">
      <div class="barra-progresso-caixa">
        <div class="barra-progresso-topo">
          <span>Instagram</span>
          <span id="progresso-texto-instagram">0%</span>
        </div>
        <div class="barra-fundo"><div class="barra-preenchida" id="progresso-barra-instagram" style="width:0%"></div></div>
      </div>
      <div class="checklist" id="checklist-instagram"></div>
    </div>

    <div class="subarea" data-subarea="ebook">
      <div class="barra-progresso-caixa">
        <div class="barra-progresso-topo">
          <span>Ebook</span>
          <span id="progresso-texto-ebook">0%</span>
        </div>
        <div class="barra-fundo"><div class="barra-preenchida" id="progresso-barra-ebook" style="width:0%"></div></div>
      </div>
      <div class="checklist" id="checklist-ebook"></div>
    </div>

    <div class="subarea" data-subarea="plataforma">
      <div class="barra-progresso-caixa">
        <div class="barra-progresso-topo">
          <span>Plataforma</span>
          <span id="progresso-texto-plataforma">0%</span>
        </div>
        <div class="barra-fundo"><div class="barra-preenchida" id="progresso-barra-plataforma" style="width:0%"></div></div>
      </div>
      <div class="checklist" id="checklist-plataforma"></div>
    </div>

    <div class="subarea" data-subarea="ideias">
      <p class="titulo-secao">Ideias soltas</p>
      <details class="caixa-ideia-livre">
        <summary style="cursor:pointer; font-family:'Playfair Display',serif; font-style:italic; color:var(--roxo-profundo);">+ Jogar uma ideia aqui</summary>
        <form id="form-ideia-livre" style="margin-top:14px;">
          <label for="fi-area">Área (opcional)</label>
          <select id="fi-area" style="margin-bottom:10px;">
            <option value="">Sem área específica</option>
            <option value="instagram">Instagram</option>
            <option value="ebook">Ebook</option>
            <option value="plataforma">Plataforma</option>
          </select>
          <label for="fi-conteudo">Sua ideia</label>
          <textarea id="fi-conteudo" required maxlength="500"></textarea>
          <button type="submit" class="btn-salvar-ideia">Salvar ideia</button>
          <div id="feedback-ideia-livre" class="feedback-form"></div>
        </form>
      </details>
      <div id="status-msg-ideias" class="status-msg-plano">Carregando ideias...</div>
      <div class="grid-ideias-livres" id="grid-ideias-livres"></div>
    </div>

  </main>
</div>

<footer>Atualizado automaticamente toda semana</footer>

<script>
  const SUPABASE_URL = "https://pjzxanenyizhfvckgogz.supabase.co";
  const SUPABASE_KEY = "sb_publishable_iWwjCsIcS7gedbY7MsTFJQ_l1_9TcPS";

  document.querySelector("nav").addEventListener("click", (evento) => {
    const botao = evento.target.closest("button[data-tela]");
    if (!botao) return;
    document.querySelectorAll("nav button").forEach((b) => b.classList.remove("ativo"));
    botao.classList.add("ativo");
    document.querySelectorAll(".tela").forEach((t) => t.classList.remove("ativa"));
    document.getElementById(`tela-${botao.dataset.tela}`).classList.add("ativa");
  });

  document.getElementById("sub-nav-plano").addEventListener("click", (evento) => {
    const botao = evento.target.closest("button[data-area]");
    if (!botao) return;
    document.querySelectorAll("#sub-nav-plano button").forEach((b) => b.classList.remove("ativo"));
    botao.classList.add("ativo");
    document.querySelectorAll(".subarea").forEach((s) => s.classList.remove("ativa"));
    document.querySelector(`.subarea[data-subarea="${botao.dataset.area}"]`).classList.add("ativa");
  });

  const badgeClasse = { reel: "badge-reel", carrossel: "badge-carrossel", story: "badge-story" };
  const proximoStatus = { novo: "em-producao", "em-producao": "feito", feito: "novo" };
  const rotuloStatus = { novo: "Novo", "em-producao": "Em produção", feito: "Feito" };

  let todasAsPautas = [];
  let filtroAtual = "todos";

  function renderizarCards() {
    const grid = document.getElementById("grid-pautas");
    const pautasFiltradas = filtroAtual === "todos"
      ? todasAsPautas
      : todasAsPautas.filter((p) => p.formato === filtroAtual);

    if (pautasFiltradas.length === 0) {
      grid.innerHTML = "";
      document.getElementById("status-msg").style.display = "block";
      document.getElementById("status-msg").textContent = "Nenhuma pauta nesse filtro ainda.";
      return;
    }
    document.getElementById("status-msg").style.display = "none";

    grid.innerHTML = pautasFiltradas.map((p) => {
      const ehMinha = p.fonte === "Julia (ideia própria)";
      const status = p.status && rotuloStatus[p.status] ? p.status : "novo";
      return `
        <div class="card ${ehMinha ? "minha" : ""} ${status === "feito" ? "feito" : ""}" data-card-id="${p.id}">
          ${ehMinha ? '<span class="selo-minha">Minha ideia</span>' : ""}
          <div class="card-topo">
            <span class="tema">${p.tema ?? ""}</span>
            <span class="badge ${badgeClasse[p.formato] ?? "badge-reel"}">${p.formato ?? ""}</span>
          </div>
          <h3>${p.titulo ?? ""}</h3>
          <p class="desc">${p.descricao ?? ""}</p>
          <div class="linha-acoes">
            <button class="status-btn ${status}" data-id="${p.id}" data-status="${status}">
              <span class="bolinha"></span> ${rotuloStatus[status]}
            </button>
            <button class="btn-descartar" data-id="${p.id}">Descartar</button>
          </div>
          <div class="card-rodape">
            <span>${p.fonte ?? ""}</span>
            ${p.link_referencia ? `<a href="${p.link_referencia}" target="_blank" rel="noopener">ver fonte →</a>` : ""}
          </div>
        </div>
      `;
    }).join("");

    document.querySelectorAll(".status-btn").forEach((botao) => {
      botao.addEventListener("click", async () => {
        const id = botao.dataset.id;
        const statusAtual = botao.dataset.status;
        const novoStatus = proximoStatus[statusAtual];
        botao.disabled = true;
        try {
          const resposta = await fetch(
            `${SUPABASE_URL}/rest/v1/pautas_conteudo?id=eq.${id}&apikey=${SUPABASE_KEY}`,
            {
              method: "PATCH",
              headers: { "Content-Type": "application/json", "Prefer": "return=minimal" },
              body: JSON.stringify({ status: novoStatus }),
            }
          );
          if (!resposta.ok) throw new Error();
          const pauta = todasAsPautas.find((p) => String(p.id) === String(id));
          if (pauta) pauta.status = novoStatus;
          renderizarCards();
        } catch {
          botao.disabled = false;
        }
      });
    });

    document.querySelectorAll(".btn-descartar").forEach((botao) => {
      botao.addEventListener("click", async () => {
        const id = botao.dataset.id;
        botao.disabled = true;
        const card = document.querySelector(`[data-card-id="${id}"]`);
        try {
          const resposta = await fetch(
            `${SUPABASE_URL}/rest/v1/pautas_conteudo?id=eq.${id}&apikey=${SUPABASE_KEY}`,
            {
              method: "PATCH",
              headers: { "Content-Type": "application/json", "Prefer": "return=minimal" },
              body: JSON.stringify({ status: "descartado" }),
            }
          );
          if (!resposta.ok) throw new Error();
          if (card) card.classList.add("saindo");
          todasAsPautas = todasAsPautas.filter((p) => String(p.id) !== String(id));
          setTimeout(renderizarCards, 180);
        } catch {
          botao.disabled = false;
        }
      });
    });
  }

  async function carregarPautas() {
    const statusMsg = document.getElementById("status-msg");
    try {
      const resposta = await fetch(
        `${SUPABASE_URL}/rest/v1/pautas_conteudo?select=*&status=neq.descartado&order=created_at.desc&apikey=${SUPABASE_KEY}`
      );
      if (!resposta.ok) throw new Error("Não consegui buscar os dados (" + resposta.status + ")");
      const pautas = await resposta.json();
      if (pautas.length === 0) {
        statusMsg.textContent = "Nenhuma pauta ainda. Assim que a rotina semanal rodar, elas aparecem aqui.";
        return;
      }
      todasAsPautas = pautas;
      renderizarCards();
    } catch (erro) {
      statusMsg.textContent = "Algo deu errado ao carregar: " + erro.message;
    }
  }

  document.getElementById("filtros").addEventListener("click", (evento) => {
    const botao = evento.target.closest("button[data-filtro]");
    if (!botao) return;
    filtroAtual = botao.dataset.filtro;
    document.querySelectorAll("#filtros button").forEach((b) => b.classList.remove("ativo"));
    botao.classList.add("ativo");
    renderizarCards();
  });

  document.getElementById("form-ideia").addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const feedback = document.getElementById("feedback-form");
    feedback.textContent = "Salvando...";
    feedback.className = "feedback-form";

    const novaIdeia = {
      titulo: document.getElementById("f-titulo").value,
      tema: document.getElementById("f-tema").value,
      descricao: document.getElementById("f-descricao").value,
      formato: document.getElementById("f-formato").value,
      fonte: "Julia (ideia própria)",
      link_referencia: document.getElementById("f-link").value || null,
      status: "novo",
    };

    try {
      const resposta = await fetch(
        `${SUPABASE_URL}/rest/v1/pautas_conteudo?apikey=${SUPABASE_KEY}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json", "Prefer": "return=minimal" },
          body: JSON.stringify(novaIdeia),
        }
      );
      if (!resposta.ok) throw new Error("Não consegui salvar (" + resposta.status + ")");

      feedback.textContent = "Ideia salva!";
      feedback.className = "feedback-form ok";
      document.getElementById("form-ideia").reset();
      carregarPautas();
    } catch (erro) {
      feedback.textContent = "Algo deu errado: " + erro.message;
      feedback.className = "feedback-form erro";
    }
  });

  carregarPautas();

  const proximoStatusPlano = { a_fazer: "em_andamento", em_andamento: "feito", feito: "a_fazer" };
  let todoPlanoAcao = [];

  function renderizarChecklist(area) {
    const itens = todoPlanoAcao.filter((i) => i.area === area).sort((a, b) => a.ordem - b.ordem);
    const container = document.getElementById(`checklist-${area}`);
    container.innerHTML = itens.map((item) => `
      <div class="item-checklist ${item.status}" data-id="${item.id}">
        <span class="marcador"></span>
        <span class="texto-item">${item.item}</span>
      </div>
    `).join("");

    const total = itens.length;
    const feitos = itens.filter((i) => i.status === "feito").length;
    const percentual = total === 0 ? 0 : Math.round((feitos / total) * 100);
    document.getElementById(`progresso-barra-${area}`).style.width = percentual + "%";
    document.getElementById(`progresso-texto-${area}`).textContent = `${percentual}% (${feitos}/${total})`;

    container.querySelectorAll(".item-checklist").forEach((el) => {
      el.addEventListener("click", async () => {
        const id = el.dataset.id;
        const item = todoPlanoAcao.find((i) => String(i.id) === String(id));
        if (!item) return;
        const novoStatus = proximoStatusPlano[item.status] ?? "a_fazer";
        try {
          const resposta = await fetch(
            `${SUPABASE_URL}/rest/v1/plano_acao?id=eq.${id}&apikey=${SUPABASE_KEY}`,
            {
              method: "PATCH",
              headers: { "Content-Type": "application/json", "Prefer": "return=minimal" },
              body: JSON.stringify({ status: novoStatus }),
            }
          );
          if (!resposta.ok) throw new Error();
          item.status = novoStatus;
          renderizarChecklist(area);
        } catch {
          /* silencioso — tenta de novo no próximo clique */
        }
      });
    });
  }

  async function carregarPlanoAcao() {
    try {
      const resposta = await fetch(
        `${SUPABASE_URL}/rest/v1/plano_acao?select=*&order=ordem.asc&apikey=${SUPABASE_KEY}`
      );
      if (!resposta.ok) throw new Error();
      todoPlanoAcao = await resposta.json();
      ["instagram", "ebook", "plataforma"].forEach(renderizarChecklist);
    } catch {
      ["instagram", "ebook", "plataforma"].forEach((area) => {
        document.getElementById(`checklist-${area}`).innerHTML =
          '<p class="status-msg-plano">Não consegui carregar o checklist agora.</p>';
      });
    }
  }

  const nomeArea = { instagram: "Instagram", ebook: "Ebook", plataforma: "Plataforma" };

  async function carregarIdeiasLivres() {
    const statusMsg = document.getElementById("status-msg-ideias");
    const grid = document.getElementById("grid-ideias-livres");
    try {
      const resposta = await fetch(
        `${SUPABASE_URL}/rest/v1/ideias_livres?select=*&order=criado_em.desc&apikey=${SUPABASE_KEY}`
      );
      if (!resposta.ok) throw new Error();
      const ideias = await resposta.json();
      if (ideias.length === 0) {
        statusMsg.textContent = "Nenhuma ideia solta guardada ainda.";
        return;
      }
      statusMsg.style.display = "none";
      grid.innerHTML = ideias.map((i) => `
        <div class="card-ideia-livre">
          ${i.area ? `<span class="area-tag">${nomeArea[i.area] ?? i.area}</span><br/>` : ""}
          ${i.conteudo}
        </div>
      `).join("");
    } catch {
      statusMsg.textContent = "Não consegui carregar as ideias agora.";
    }
  }

  document.getElementById("form-ideia-livre").addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const feedback = document.getElementById("feedback-ideia-livre");
    feedback.textContent = "Salvando...";
    feedback.className = "feedback-form";

    const novaIdeia = {
      area: document.getElementById("fi-area").value || null,
      conteudo: document.getElementById("fi-conteudo").value,
    };

    try {
      const resposta = await fetch(
        `${SUPABASE_URL}/rest/v1/ideias_livres?apikey=${SUPABASE_KEY}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json", "Prefer": "return=minimal" },
          body: JSON.stringify(novaIdeia),
        }
      );
      if (!resposta.ok) throw new Error("Não consegui salvar (" + resposta.status + ")");
      feedback.textContent = "Ideia salva!";
      feedback.className = "feedback-form ok";
      document.getElementById("form-ideia-livre").reset();
      carregarIdeiasLivres();
    } catch (erro) {
      feedback.textContent = "Algo deu errado: " + erro.message;
      feedback.className = "feedback-form erro";
    }
  });

  carregarPlanoAcao();
  carregarIdeiasLivres();
</script>

</body>
</html>
